name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Proxmox VE 8 ships Python 3.11, PVE 9 ships 3.13; the demo supports 3.10+.
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q backend demo.py tools
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: python3 tools/check_web.py

  ui:
    # The menu itself in a headless Chrome, against the demo (tools/ui_check.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-demo.txt
      - run: pip install -r requirements-demo.txt
      - run: python tools/ui_check.py --start-demo --no-sandbox

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: bash -n
        run: for f in install.sh update.sh uninstall.sh demo.sh kiosk/kiosk.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck -S error install.sh update.sh uninstall.sh demo.sh kiosk/kiosk.sh
