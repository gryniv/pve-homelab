# PVE Homelab configuration: /etc/pve-homelab/config.yaml
# install.sh generates this file on first run by detecting your hardware
# (python3 -m pvehomelab.setup). This example shows every option.
# After editing: systemctl restart pve-homelab 'pve-homelab-kiosk@*'

listen: 127.0.0.1:8900       # 0.0.0.0:8900 only for the reverse proxy below (web.allow_from)
                             # the kiosk follows the port; the address must include loopback (127.0.0.1 or 0.0.0.0)
# The menu in a browser elsewhere, through a reverse proxy with TLS (e.g. Caddy on home.example.com).
# Only loopback and these addresses or networks may talk to the backend; a browser that comes through
# the proxy is the "web" seat: it never switches a monitor or hands over a GPU.
web:
  enabled: true
  allow_from: []              # e.g. [192.168.8.150] (the Caddy container) or [10.0.0.0/24]
  sign_in: minimal            # what its sign-in screen shows before anyone signs in: minimal (a name field,
                              # weather and clocks), users (the people too) or full (host figures, as on the host)
allowed_hosts: []             # extra Host names for browsers on this machine; "*" turns the check off
node: ""                      # empty = this host's name
language: en                  # default UI language (uk, en); every user can pick their own
systems_tag: seat             # VMs with this tag appear under Systems
systems_extra: []             # untagged VMs to show as well, e.g. [100]

# A seat = a GPU with a monitor where the host draws its own menu.
# Each seat has its own login. A GPU passed to a VM can't be a seat while that VM runs.
seats:
  igpu:
    title: Integrated Radeon
    gpu: "0000:79:00.0"       # lspci -D
    tty: 7
    kiosk: true

# Monitors wired to several GPUs. For each GPU: the monitor input code (DDC/CI, VCP 0x60).
# Find the codes with: ddcutil capabilities | grep -A8 'Feature: 60'
# With this the menu switches the monitor to a VM's GPU when you start it, and back when it stops.
monitors:
  main:
    ddc_bus: auto             # or N from /dev/i2c-N (see: ddcutil detect)
    inputs:
      "0000:79:00.0": 0x11    # HDMI-1: the menu
      "0000:02:00.0": 0x0f    # DisplayPort-1: discrete GPU for VMs

launch:
  assign_gpu: true            # write the chosen GPU into the VM config before start
  allow_igpu: false           # true = pass the seat GPU through entirely (otherwise VirGL inside the menu)
  return_to_menu: true        # switch the monitor back to the menu when the VM stops
  follow_start: boot          # a VM on a monitor's GPU that starts without the menu (onboot, Proxmox UI) gets
                              # the monitor: boot = only while the host is booting, always, never

# The keyboard, mouse and gamepads of a screen on the host go into a system together with the monitor
# (for the session only; the VM's config is not touched, and what the VM already has stays its own).
input:
  mode: evdev                 # evdev: keyboard and mouse, given back by the hotkey below; off
  hotkey: ctrl-ctrl           # QEMU's grab-toggle: ctrl-ctrl, alt-alt, shift-shift, meta-meta, scrolllock, ctrl-scrolllock
  gamepads: usb               # gamepads plugged into the VM as USB devices for the session; off
  devices: []                 # ids from Settings → Systems (1-3 for a USB port); empty = all of them

caddy:
  ct: null                    # container running Caddy (its admin API must listen on localhost:2019)
  admin: http://localhost:2019
  prefer_suffix: ""           # for duplicates (x.example.com / x.internal) keep this suffix
  hide: []                    # subdomains to skip, e.g. [home]

# Web UIs found without Caddy (Caddy entries win when both find the same one):
#   ports: open TCP ports of running containers (read from the host) + common web ports of VMs,
#          each checked with GET / — only pages that answer with HTML are listed
#   notes: links written in a guest's Notes in Proxmox, e.g. [Grafana](http://10.0.0.5:3000)
discovery:
  ports: true
  vms: true                   # also probe VMs (needs the qemu guest agent for their IP)
  notes: true
  ignore: []                  # e.g. [ct206, "ct206:3003", vm102, node]

# Nice names and logos. Key = first part of the domain (Caddy) or ct<id>-<port> / vm<id>-<port> (found).
# icon = a name from https://github.com/homarr-labs/dashboard-icons ("" = first letter)
services: {}
#  photos: {name: Photos, icon: immich, desc: Immich}
#  vault:  {name: Passwords, icon: vaultwarden}

# Links that don't go through Caddy
links: []
#  - {name: Router, url: "http://192.168.1.1", icon: openwrt}

# Machines the "Wake up" widget can switch on (Wake-on-LAN). Users need Sys.PowerMgmt on the node.
wol: []
#  - {name: NAS, mac: "aa:bb:cc:dd:ee:ff"}
#  - {name: Desktop, mac: "11:22:33:44:55:66", broadcast: 192.168.1.255, port: 9}

# A Wake-on-LAN packet for a listed VM's network card starts that VM (e.g. Moonlight's "Wake PC").
# Off unless enabled; only these VMs, from these networks (empty: any). It never switches a monitor.
wol_listen:
  enabled: false
  vms: []                     # e.g. [102]
  from: []                    # e.g. [192.168.8.0/24]
  ports: [9]                  # UDP; open it in the Proxmox firewall if that is on

weather:
  city: Kyiv
  units: c                    # c or f

users:
  hide: []                    # accounts to hide on the login screen, e.g. [root@pam]

saver:
  after_min: 5                # screensaver on the login screen
lock_after_min: 15            # log out of the dashboard after this much inactivity
screen:                       # the menu's monitors go dark (DDC standby + a black page); any key wakes them
  off_after_min: 0            # minutes without a key; 0 = never
  night: ""                   # e.g. "23:00-07:00": dark after a minute without a key

designer: false               # live reload of designs while you work on them on the host (the demo has it on)

alerts:                       # the bell in the top bar
  storage_pct: 90             # a storage this full (%) is reported
  temp_c: 85                  # host temperature (°C) worth a warning
  backup_days: 7              # a guest without a newer backup is reported

feedback:                     # Settings → About → Write to the author (a GitHub issue; `feedback: false` hides it)
  enabled: true
  repo: ""                    # owner/name; empty = where updates come from

kiosk:
  debug_port: 0               # >0 = Chromium DevTools on 127.0.0.1:<port> (development only)

# Updates from GitHub. The menu shows "Update vX.Y.Z" in the top bar and reminds after sign-in;
# users with Sys.Modify on / can install it from there. Git is not needed on the host.
update:
  repo: ""                    # owner/name; empty = the repository this was installed from, else gryniv/pve-homelab
  channel: release            # release = latest GitHub release (tag vX.Y.Z); main = newest commit of `branch`
  branch: main
  auto: false                 # true = install new versions by itself every night (pve-homelab-update.timer);
                              # Settings → About → "Update by itself" (admins) wins over this
  auto_main: false            # with channel main, auto installs any pushed commit only if this is true
  check_hours: 6

# Parts of the menu that can be switched off for the whole host (also in Settings → System → Components).
# What is off leaves the menu, and its part of the API answers 404.
features:
  alerts: true                # the bell in the top bar
  node_updates: true          # the Proxmox updates button and widget
  app_updates: true           # asking GitHub for new versions of the menu, and installing them
  weather: true               # weather in the top bar, its widget and the screensaver's sky
  consoles: true              # VM and container screens in the menu (noVNC)
  guest_actions: true         # start, shut down, reboot of guests from the menu
  guest_settings: true        # memory, cores, start at boot, tags and notes of guests, changed in the menu
  host_power: true            # reboot and shut down the host from Quick actions
  wol: true                   # the Wake up widget
  my_designs: true            # installing and removing designs in the menu
  my_widgets: true            # installing and removing widgets in the menu
